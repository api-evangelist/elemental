name: Elemental
description: >-
  Elemental (Elemental Technologies) was a Portland, Oregon video encoding and
  multiscreen delivery company founded in 2006 and backed by General Catalyst.
  Its software powered large over-the-top and broadcast video providers before
  Amazon Web Services acquired the company in 2015. The business now operates as
  the AWS Elemental brand within AWS Media Services, spanning cloud services
  (MediaConvert, MediaLive, MediaPackage, MediaConnect, MediaStore, MediaTailor)
  and on-premises appliances and software (Elemental Live, Elemental Server,
  Elemental Conductor, Elemental Statmux, Elemental Link). Elemental no longer
  operates an independent developer portal; its API surface is delivered through
  AWS SDKs and the AWS Elemental documentation. This profile was surfaced as a
  General Catalyst portfolio company; the investment exited via acquisition.
